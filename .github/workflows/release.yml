name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          DATE=$(date -u +%Y.%-m.%-d)
          MAX_BUILD=$(gh release list --limit 100 --json tagName | jq -r --arg date "$DATE" '
            [.[] | .tagName
             | select(test("^" + ($date | gsub("\\."; "\\.")) + "-[0-9]+$"))
             | capture("-(?<n>[0-9]+)$").n
             | tonumber] | max // 0
          ')
          BUILD=$((MAX_BUILD + 1))
          echo "version=${DATE}-${BUILD}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            artifact: sclerox
            cross: ''
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            artifact: sclerox
            cross: zig
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact: sclerox
            cross: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            artifact: sclerox
            cross: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            artifact: sclerox.exe
            cross: ''

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild (linux-arm64)
        if: matrix.cross == 'zig'
        run: cargo install cargo-zigbuild

      - name: Build (native)
        if: matrix.cross == ''
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cargo-zigbuild, linux-arm64)
        if: matrix.cross == 'zig'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Stage artifact (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p stage
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} stage/
          tar czf sclerox-${{ matrix.target }}.tar.gz -C stage .

      - name: Stage artifact (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.artifact }}" -Destination stage/
          Get-ChildItem -Path "target/${{ matrix.target }}/release" -Filter *.dll -File |
            Copy-Item -Destination stage/
          Compress-Archive -Path "stage/*" -DestinationPath "sclerox-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: sclerox-${{ matrix.target }}
          path: sclerox-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            --title "${{ needs.version.outputs.version }}" \
            --generate-notes \
            artifacts/*