import secrets


def rotate_password(env: str) -> str:
    """Generate a new database password for env and store it in the vault."""
    password = secrets.token_urlsafe(32)
    store_secret(f"{env}/db-password", password)
    return password


def store_secret(path: str, value: str) -> None:
    raise NotImplementedError("wire up the vault client")
