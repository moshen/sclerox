[[file]]
path = "src/billing/sales_tax.rs"
content = '''
pub fn rate_for(region: &str) -> f64 {
    match region {
        "CA" => 0.0725,
        "NY" => 0.04,
        "TX" => 0.0625,
        _ => 0.0,
    }
}

pub fn apply(amount_cents: i64, region: &str) -> i64 {
    amount_cents + (amount_cents as f64 * rate_for(region)).round() as i64
}
'''

