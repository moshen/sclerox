[[file]]
path = "src/invoice.rs"
content = '''
/// A parsed supplier invoice with its line items and total.
pub struct FinancialDocument {
    pub supplier: String,
    pub total_cents: i64,
    pub lines: Vec<LineItem>,
}

/// One billed line of an invoice.
pub struct LineItem {
    pub description: String,
    pub amount_cents: i64,
}

/// Parse raw invoice text into a FinancialDocument, or None when it has no
/// supplier line.
pub fn parse_invoice(text: &str) -> Option<FinancialDocument> {
    let supplier = text.lines().find_map(|l| l.strip_prefix("Supplier: "))?;
    let lines: Vec<LineItem> = text
        .lines()
        .filter_map(|l| {
            let (description, amount) = l.rsplit_once(' ')?;
            let amount_cents = amount.parse().ok()?;
            Some(LineItem { description: description.to_string(), amount_cents })
        })
        .collect();
    let total_cents = lines.iter().map(|l| l.amount_cents).sum();
    Some(FinancialDocument { supplier: supplier.to_string(), total_cents, lines })
}
'''

[[file]]
path = "src/retry.rs"
content = '''
use std::{thread, time::Duration};

/// Call `f` up to `attempts` times, sleeping base_ms, then twice as long,
/// between failures. Returns the last error when every attempt fails.
pub fn with_backoff<T>(
    attempts: u32,
    base_ms: u64,
    mut f: impl FnMut() -> Result<T, String>,
) -> Result<T, String> {
    let mut delay = base_ms;
    let mut last = String::new();
    for _ in 0..attempts {
        match f() {
            Ok(v) => return Ok(v),
            Err(e) => last = e,
        }
        thread::sleep(Duration::from_millis(delay));
        delay *= 2;
    }
    Err(last)
}
'''

