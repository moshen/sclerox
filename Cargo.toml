[package]
name = "sclerox"
version = "0.1.0"
edition = "2021"
description = "Sclerox CLI - SQLite-backed knowledge base for AI-augmented engineering"

[[bin]]
name = "sclerox"
path = "src/main.rs"

[lib]
name = "sclerox"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
shlex = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
fastembed = { version = "5", features = ["online"] }
# The onnxruntime fastembed runs on, at the version it pins. Named here to pick
# execution providers (see src/embed/device.rs); no extra compile.
ort = { version = "=2.0.0-rc.12", default-features = false }
# Same version fastembed already pins, so no extra compile. Used for exact
# token counts with MiniLM's tokenizer (see src/embed/tokens.rs).
tokenizers = "0.22"
# Same version and features fastembed's `online` feature already pulls in, so
# no extra compile. Downloads pinned, hash-checked model files into sclerox's
# own cache folder (see src/embed/download.rs). `native-tls` verifies against
# the OS certificate store, so TLS-inspecting corporate proxies work.
ureq = { version = "3", features = ["native-tls"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
walkdir = "2"
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
log = { version = "0.4", features = ["std"] }
memory-stats = "1"
tree-sitter-java = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-bash = "0.25.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-lua = "0.5.0"
sqlite-vec = "0.1.9"
interprocess = "2"
postcard = { version = "1", features = ["use-std"] }

# CoreML ships with macOS and in the macOS onnxruntime build.
[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["coreml"] }

# DirectML ships with Windows and in the Windows onnxruntime build (see
# build.rs); fastembed's feature also sets the session options it needs.
[target.'cfg(windows)'.dependencies]
fastembed = { version = "5", features = ["online", "directml"] }

[patch.crates-io]
esaxx-rs = { path = "vendor/esaxx-rs" }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
