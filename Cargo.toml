[package]
name = "ol"
version = "0.1.0"
edition = "2021"
description = "Operating Layer CLI - SQLite-backed knowledge base for AI-augmented engineering"

[[bin]]
name = "ol"
path = "src/main.rs"

[lib]
name = "ol"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
fastembed = { version = "5", features = ["online"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "5"
log = { version = "0.4", features = ["std"] }
memory-stats = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
sqlite-vec = "0.1.9"
